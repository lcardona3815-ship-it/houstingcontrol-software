# Perfil "h2": ejecuta la aplicacion SIN Docker ni PostgreSQL, con una base H2 en memoria.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# Consola web: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:housing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1   User: sa   Password: (vacio)
# Solo para desarrollo y demostracion. Todo se borra al apagar la aplicacion.

spring.datasource.url=jdbc:h2:mem:housing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Las tablas las genera Hibernate a partir de las entidades (no se usa v1-initial-schema.sql)
spring.jpa.hibernate.ddl-auto=create-drop

# Despues de crear las tablas, carga los datos de demostracion
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-h2.sql
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=true
